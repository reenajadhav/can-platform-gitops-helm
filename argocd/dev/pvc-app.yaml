---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pvc-dev
spec:
  project: default
  source:
    repoURL: https://github.com/reenajadhav/can-platform-gitops-helm.git
    targetRevision: HEAD
    path: platform/pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
