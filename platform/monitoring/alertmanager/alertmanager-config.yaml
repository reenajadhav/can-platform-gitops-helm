apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring

data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'sahityareena@gmail.com'

    route:
      receiver: email-notifications

    receivers:
      - name: email-notifications
        email_configs:
          - to: 'sahityareena@gmail.com'
            send_resolved: true
