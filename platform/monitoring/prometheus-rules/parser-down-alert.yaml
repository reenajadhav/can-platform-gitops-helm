apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: parser-down-alert
  namespace: monitoring

spec:
  groups:
  - name: parser-alerts

    rules:
    - alert: ParserDown

      expr: up{job="parser"} == 0

      for: 1m

      labels:
        severity: critical

      annotations:
        summary: "Parser service is down"

        description: "Parser metrics endpoint is unavailable for more than 1 minute."
