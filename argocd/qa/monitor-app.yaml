apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitor-qa
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reenajadhav/can-platform-gitops-helm.git
    targetRevision: HEAD
    path: platform/servicemonitor
  destination:
    server: https://kubernetes.default.svc
    namespace: qa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true