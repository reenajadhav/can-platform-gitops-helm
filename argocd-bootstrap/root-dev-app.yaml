---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: can-platform-root-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reenajadhav/can-platform-gitops-helm.git
    targetRevision: master
    path: argocd/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

