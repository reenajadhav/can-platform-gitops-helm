---
# Source: dashboard/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-dev
  labels:
    helm.sh/chart: dashboard-0.1.0
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/instance: dashboard-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: dashboard/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: dashboard-dev
  labels:
    helm.sh/chart: dashboard-0.1.0
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/instance: dashboard-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: NodePort
  ports:
    - port: 8501
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/instance: dashboard-dev
---
# Source: dashboard/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-dev
  labels:
    helm.sh/chart: dashboard-0.1.0
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/instance: dashboard-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
      app.kubernetes.io/instance: dashboard-dev
  template:
    metadata:
      labels:
        helm.sh/chart: dashboard-0.1.0
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/instance: dashboard-dev
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: dashboard-dev
      containers:
        - name: dashboard
          image: "can-dashboard:55"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - mountPath: /shared
              name: can-data
          env:
            - name: APP_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: can-platform-secret
                  key: REDIS_HOST

            - name: APP_REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: can-platform-secret
                  key: REDIS_PORT

            - name: ENVIRONMENT
              valueFrom:
                secretKeyRef:
                  name: can-platform-secret
                  key: ENVIRONMENT
            - name: DB-PATH
              valueFrom:
                secretKeyRef:
                  name: can-platform-secret
                  key: DB_PATH
      volumes:
        - name: can-data
          persistentVolumeClaim:
            claimName: can-pvc
---
# Source: dashboard/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "dashboard-dev-test-connection"
  labels:
    helm.sh/chart: dashboard-0.1.0
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/instance: dashboard-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['dashboard-dev:8501']
  restartPolicy: Never
