---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: can-dashboard

  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/reenajadhav/can-platform-gitops-helm.git

    targetRevision: HEAD

    path: applications/dashboard

  destination:
    server: https://kubernetes.default.svc

    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

