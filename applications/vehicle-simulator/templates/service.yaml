apiVersion: v1
kind: Service
metadata:
  name: {{ include "vehicle-simulator.fullname" . }}
  labels:
    {{- include "vehicle-simulator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: metrics
  selector:
    {{- include "vehicle-simulator.selectorLabels" . | nindent 4 }}
