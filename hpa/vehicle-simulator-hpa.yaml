apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: vehicle-simulator-hpa
  namespace: dev

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vehicle-simulator-dev

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 70