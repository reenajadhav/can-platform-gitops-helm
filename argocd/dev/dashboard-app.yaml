---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/reenajadhav/can-platform-gitops-helm.git
    targetRevision: HEAD
    path: applications/dashboard
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

