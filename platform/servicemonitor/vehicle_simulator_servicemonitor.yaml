---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: vehicle-simulator-monitor
  namespace: monitoring
  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: vehicle-simulator
      app.kubernetes.io/name: vehicle-simulator

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: metrics
      interval: 15s
